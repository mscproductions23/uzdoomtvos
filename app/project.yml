# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: UZDoomTV
options:
  bundleIdPrefix: com.mscproductions          # <-- change to your reverse-DNS prefix
  deploymentTarget:
    tvOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.0
targets:
  UZDoomTV:
    type: application
    platform: tvOS
    sources:
      - Sources/App
      - path: Resources
        optional: true
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mscproductions.uzdoomtv   # <-- change
        DEVELOPMENT_TEAM: "YOURTEAMID"                     # <-- change (Apple Developer team ID)
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Used to receive WAD and save files beamed from your iPhone."
    entitlements:
      path: UZDoomTV.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.mscproductions.uzdoomtv                   # <-- change, match DoomCloudStore.swift
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
